name: sholat
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  adhan: ^2.0.0+1
  android_alarm_manager_plus: ^4.0.7
  android_intent_plus: ^5.3.0
  audioplayers: ^6.5.0
  awesome_notifications: ^0.10.1
  cupertino_icons: ^1.0.8
  device_info_plus: ^11.5.0
  flutter:
    sdk: flutter
  flutter_compass: ^0.8.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6
  flutter_svg: ^2.2.0
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  get: ^4.7.2
  intl: ^0.20.2
  lottie: ^3.3.1
  permission_handler: ^12.0.1
  salomon_bottom_bar: ^3.3.2
  shared_preferences: ^2.5.3
  timezone: ^0.10.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/
    - assets/lottie/
    - assets/lottie/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF" # Warna latar belakang splash screen (misal: putih)
  image: "assets/images/splash_logo.png"
  android: true
  fullscreen: true # Untuk menutupi seluruh layar
  # optional: Anda bisa menambahkan background_image jika perlu
  # background_image: "assets/images/splash_bg.png"
  # Jika Anda ingin mendukung Android 12 (adaptive splash screen)
  # android_12:
  #   image: "assets/images/splash_logo.png"
  #   icon_background_color: "#FFFFFF" # Warna di belakang ikon utama
  # Untuk tampilan yang lebih konsisten, pastikan status bar dan navigation bar transparan
